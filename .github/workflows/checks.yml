name: CubeForge checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile cubeforge.py cube_generator.py draft_simulator.py draft_ui.py
      - name: Run headless tests
        run: python -m unittest discover -s tests -v
      - name: Prepare both shipped cube presets
        run: |
          python cubeforge.py --preset full --seed 42 --prepare-only
          python cubeforge.py --preset enhancement-test --seed 42 --prepare-only
